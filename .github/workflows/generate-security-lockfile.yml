name: Generate security patch lockfile

on:
  push:
    branches:
      - security/minimum-vite-vitest-patches-2026-09-04

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          ref: security/minimum-vite-vitest-patches-2026-09-04
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Generate package manifest and lockfile with npm
        run: npm install --save-dev --save-exact vite@7.3.2 vitest@3.2.6 --package-lock-only
      - name: Commit generated files
        run: |
          if git diff --quiet -- package.json package-lock.json; then
            echo "No dependency changes to commit"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package.json package-lock.json
            git commit -m "fix(deps): apply minimum Vite and Vitest security patches"
            git push
          fi
      - name: Verify clean install
        run: npm ci
      - name: Validate project
        run: |
          npm run check
          npm run build
