name: Generate security patch lockfile

on:
  push:
    branches:
      - security/minimum-vite-vitest-patches-2026-09-04

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: security/minimum-vite-vitest-patches-2026-09-04
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Generate lockfile with npm
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund --fetch-retries=2 --fetch-timeout=60000
      - name: Commit generated lockfile
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "No lockfile changes to commit"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "fix(deps): regenerate lockfile for patched toolchain"
            git push
          fi
