name: Hosted Pages Diagnostic

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TARGET_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Exercise hosted runtime with proposed acceptance fix
        shell: bash
        run: |
          set -o pipefail
          log_file="$(mktemp)"
          status=0
          node scripts/hosted-browser-acceptance.mjs 2>&1 | tee "$log_file" || status=${PIPESTATUS[0]}
          {
            echo '### Hosted Pages diagnostic'
            echo '```text'
            tail -n 40 "$log_file"
            echo '```'
          } > diagnostic.md
          gh pr comment "${{ github.event.pull_request.number }}" --body-file diagnostic.md
          exit "$status"
