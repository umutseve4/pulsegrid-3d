name: Hosted Pages Diagnostic

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hosted-pages-diagnostic-${{ github.ref }}
  cancel-in-progress: true

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TARGET_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Reproduce hosted Chrome failure with visible diagnostics
        shell: bash
        run: |
          set -o pipefail
          log_file="$(mktemp)"
          diagnostic_script="$(mktemp --suffix=.mjs)"
          cp scripts/hosted-browser-acceptance.mjs "$diagnostic_script"
          sed -i "/const identity = await evaluate/a\\  console.log(JSON.stringify({ diagnostic_identity: identity, target_url: targetUrl }));" "$diagnostic_script"
          status=0
          node "$diagnostic_script" 2>&1 | tee "$log_file" || status=${PIPESTATUS[0]}
          if [[ "$status" -ne 0 ]]; then
            diagnostic="$(tail -n 30 "$log_file" | tr '\n' ' ' | sed -e 's/%/%25/g' -e 's/\r/%0D/g' -e 's/\n/%0A/g')"
            echo "::error title=Hosted browser diagnostic::${diagnostic}"
            exit "$status"
          fi
