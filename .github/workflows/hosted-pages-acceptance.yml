name: Hosted Pages Acceptance

on:
  workflow_run:
    workflows: ["Deploy Pages"]
    types: [completed]

permissions:
  actions: read
  contents: read
  deployments: read
  issues: write

concurrency:
  group: hosted-pages-acceptance
  cancel-in-progress: true

jobs:
  production:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TARGET_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
      EXPECTED_SHA: ${{ github.event.workflow_run.head_sha }}
      EXPECTED_RUN_ID: ${{ github.event.workflow_run.id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
      - name: Verify current hosted deployment metadata
        run: |
          set +e
          set -o pipefail
          node --input-type=module <<'NODE' 2>&1 | tee metadata-evidence.log
          const url = new URL('deployment.json', process.env.TARGET_URL);
          url.searchParams.set('run', process.env.EXPECTED_RUN_ID);
          const expected = {
            commit_sha: process.env.EXPECTED_SHA,
            workflow_run_id: process.env.EXPECTED_RUN_ID
          };
          let lastError;
          for (let attempt = 1; attempt <= 24; attempt += 1) {
            try {
              const response = await fetch(url, { cache: 'no-store' });
              console.log(JSON.stringify({ attempt, requested_url: url.href, final_url: response.url, status: response.status }));
              if (!response.ok) throw new Error(`HTTP ${response.status}`);
              const actual = await response.json();
              if (
                actual.commit_sha !== expected.commit_sha ||
                actual.workflow_run_id !== expected.workflow_run_id ||
                Object.keys(actual).sort().join(',') !== 'commit_sha,workflow_run_id'
              ) throw new Error(`metadata mismatch: ${JSON.stringify(actual)}`);
              console.log(JSON.stringify(actual));
              process.exit(0);
            } catch (error) {
              lastError = error;
              console.log(`Attempt ${attempt}/24 failed: ${error.message}`);
              if (attempt < 24) await new Promise((resolve) => setTimeout(resolve, 5000));
            }
          }
          throw lastError;
          NODE
          status=$?
          set -e
          {
            echo '## Hosted deployment metadata'
            echo '```json'
            cat metadata-evidence.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"
      - name: Exercise the hosted runtime in Chrome
        run: |
          set +e
          set -o pipefail
          node scripts/hosted-browser-acceptance.mjs 2>&1 | tee browser-evidence.log
          status=$?
          set -e
          {
            echo '## Hosted Chrome acceptance'
            echo '```text'
            cat browser-evidence.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"
      - name: Publish durable acceptance evidence
        env:
          GH_TOKEN: ${{ github.token }}
          HOSTED_RUN_ID: ${{ github.run_id }}
          HOSTED_RUN_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail
          test -s metadata-evidence.log
          test -s browser-evidence.log

          hosted_job_id="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$HOSTED_RUN_ID/jobs" --jq 'first(.jobs[] | select(.name == "production") | .id)')"
          [[ "$hosted_job_id" =~ ^[0-9]+$ ]]

          deployment_id=''
          deployment_status_id=''
          deployment_state=''
          for attempt in {1..12}; do
            gh api "repos/$GITHUB_REPOSITORY/deployments?sha=$EXPECTED_SHA&environment=github-pages&per_page=10" > deployments.json
            while IFS= read -r candidate_id; do
              gh api "repos/$GITHUB_REPOSITORY/deployments/$candidate_id/statuses?per_page=1" > deployment-statuses.json
              if jq -e --arg expected_run_id "$EXPECTED_RUN_ID" '((.[0].state // "") == "success") and (((try ((.[0].log_url // "") | capture("/actions/runs/(?<id>[0-9]+)(?:/|$|[?#])").id) catch "")) == $expected_run_id)' deployment-statuses.json > /dev/null; then
                deployment_id="$candidate_id"
                deployment_status_id="$(jq -r '.[0].id' deployment-statuses.json)"
                deployment_state="$(jq -r '.[0].state' deployment-statuses.json)"
                break
              fi
            done < <(jq -r '.[].id' deployments.json)
            if [[ -n "$deployment_id" ]]; then break; fi
            if [[ "$attempt" -lt 12 ]]; then sleep 5; fi
          done

          [[ "$deployment_id" =~ ^[0-9]+$ ]]
          [[ "$deployment_status_id" =~ ^[0-9]+$ ]]
          test "$deployment_state" = success

          ci_run_id=''
          for attempt in {1..12}; do
            gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$EXPECTED_SHA&branch=main&event=push&per_page=10" > ci-runs.json
            ci_run_id="$(jq -r --arg sha "$EXPECTED_SHA" 'first(.workflow_runs[] | select(.head_sha == $sha and .head_branch == "main" and .event == "push" and .conclusion == "success") | .id) // empty' ci-runs.json)"
            if [[ "$ci_run_id" =~ ^[0-9]+$ ]]; then
              gh api "repos/$GITHUB_REPOSITORY/actions/runs/$ci_run_id/jobs?per_page=100" > ci-jobs.json
              if jq -e '(.total_count == 5) and (.jobs | length == 5) and all(.jobs[]; .conclusion == "success")' ci-jobs.json > /dev/null; then break; fi
            fi
            ci_run_id=''
            if [[ "$attempt" -lt 12 ]]; then sleep 5; fi
          done

          [[ "$ci_run_id" =~ ^[0-9]+$ ]]
          jq -e '(.total_count == 5) and (.jobs | length == 5) and all(.jobs[]; .conclusion == "success")' ci-jobs.json > /dev/null
          ci_jobs="$(jq -r '.jobs | sort_by(.name)[] | "- \(.name): job `\(.id)`, conclusion `\(.conclusion)`"' ci-jobs.json)"

          evidence_file="$(mktemp)"
          {
            echo "## Hosted Pages Acceptance #$HOSTED_RUN_NUMBER evidence"
            echo
            echo "- Hosted run: \`$HOSTED_RUN_ID\`"
            echo "- Production job: \`$hosted_job_id\`"
            echo "- Trigger: \`workflow_run\` from Deploy Pages run \`$EXPECTED_RUN_ID\`"
            echo "- Tested commit: \`$EXPECTED_SHA\`"
            echo "- CI run: \`$ci_run_id\`, conclusion \`success\`"
            echo "- Pages deployment: \`$deployment_id\`, status \`$deployment_state\` (status ID \`$deployment_status_id\`)"
            echo
            echo '### CI jobs'
            printf '%s\n' "$ci_jobs"
            echo
            echo '### Hosted deployment metadata'
            sed 's/^/    /' metadata-evidence.log
            echo
            echo '### Hosted Chrome acceptance'
            sed 's/^/    /' browser-evidence.log
          } > "$evidence_file"

          gh issue comment 19 --repo "$GITHUB_REPOSITORY" --body-file "$evidence_file"
